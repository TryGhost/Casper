minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

allowBuilds:
  # Optional dtrace bindings for bunyan (a gscan dependency); not needed to build/test the theme.
  dtrace-provider: false

pnpmfile: []

# archiver still requests minimatch 10 through readdir-glob 3.
overrides:
  "minimatch@>=7 <11.0.1": 11.0.8
  # Keep the legacy release-utils error dependency on a patched CommonJS uuid.
  "@tryghost/errors@1>uuid": 14.0.3
